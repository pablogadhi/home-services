# --- qBittorrent -----------------------------------------------------------
# Settings → Web UI: clear "Web UI Base URL" and untick
# "Enable Host header validation", then restart. Without that untick every
# request 401s, because qBittorrent compares Host against its own bind address.
server {
    listen 80; listen [::]:80;
    server_name qbittorrent.commander.one qbt.commander.one;
    access_log /var/log/nginx/qbittorrent.access.log;

    client_max_body_size 100M;   # .torrent uploads
    proxy_read_timeout   300s;   # slow /api/v2/sync/maindata on big libraries

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://qbittorrent;
    }
}

# --- Prowlarr ----------------------------------------------------------------
