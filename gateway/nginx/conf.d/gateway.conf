}

# --- Syncthing ---------------------------------------------------------------
# Add commander.one's IP (or 0.0.0.0/::) to Settings → GUI → "Insecure Admin
# Access" is NOT needed, but you must add the vhost to GUI → "Skip Host
# check" / config.xml <gui><insecureSkipHostcheck>true</insecureSkipHostcheck>,
# otherwise Syncthing 403s on Host header mismatch, same class of issue as
# qBittorrent above.
server {
    listen 80; listen [::]:80;
    server_name syncthing.commander.one;
    access_log /var/log/nginx/syncthing.access.log;

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://syncthing;
    }
}

# --- Job Scout ---------------------------------------------------------------
# Feedback page for the digest's signed vote links (~/job-scout, compose
# service `feedback`). Point JOB_SCOUT_FEEDBACK__BASE_URL at this vhost.
server {
    listen 80; listen [::]:80;
    server_name job-scout.commander.one;
    access_log /var/log/nginx/jobscout.access.log;

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://jobscout;
    }
}
