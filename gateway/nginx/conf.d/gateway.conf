# ===========================================================================
#  commander.one — subdomain-based service gateway
# ===========================================================================
#  Every service gets its own vhost and is served at the root of that vhost,
#  so login redirects, absolute asset paths and session cookies all behave
#  exactly as they would without a proxy. No URL Base / base-path setting is
#  needed in any of the applications — clear them if you set any.
#
#  Backends are reached over 127.0.0.1 because the gateway container uses
#  network_mode: host. On bridge networking, swap for host.docker.internal.
# ===========================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Backends --------------------------------------------------------------
upstream filegator     { server 127.0.0.1:8080;  keepalive 8; }
upstream homeassistant { server 127.0.0.1:8123;  keepalive 8; }
upstream ewelink       { server 127.0.0.1:3000;  keepalive 8; }
upstream jellyfin      { server 127.0.0.1:8096;  keepalive 8; }
upstream sonarr        { server 127.0.0.1:8989;  keepalive 8; }
upstream radarr        { server 127.0.0.1:7878;  keepalive 8; }
upstream bazarr        { server 127.0.0.1:6767;  keepalive 8; }
# AdGuard Home binds its web UI to the LAN address only (http.address in
# /opt/AdGuardHome/AdGuardHome.yaml), so it is not reachable on 127.0.0.1.
upstream adguard       { server 192.168.1.2:3001;  keepalive 8; }
upstream qbittorrent   { server 127.0.0.1:8081;  keepalive 8; }
upstream prowlarr      { server 127.0.0.1:9696;  keepalive 8; }
upstream syncthing     { server 127.0.0.1:8384;  keepalive 8; }
upstream jobscout      { server 127.0.0.1:8765;  keepalive 8; }

# ===========================================================================
#  Landing page — http://commander.one/
#  Also the default_server, so unknown subdomains land here instead of
#  hitting whichever vhost happens to be defined first.
# ===========================================================================
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name commander.one;

    access_log /var/log/nginx/landing.access.log;
    error_log  /var/log/nginx/landing.error.log warn;

    root  /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ===========================================================================
#  Services — one vhost each, all at the vhost root
# ===========================================================================

# --- FileGator -------------------------------------------------------------
# Clear APP_URL in configuration.php (or set it to '/') now that it is at root.
server {
    listen 80; listen [::]:80;
    server_name filegator.commander.one;
    access_log /var/log/nginx/filegator.access.log;

    client_max_body_size 0;      # large uploads
    client_body_timeout  300s;

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://filegator;
    }
}

# --- Home Assistant --------------------------------------------------------
# Requires use_x_forwarded_for + trusted_proxies in configuration.yaml.
server {
    listen 80; listen [::]:80;
    server_name homeassistant.commander.one ha.commander.one;
    access_log /var/log/nginx/homeassistant.access.log;

    client_max_body_size 0;      # backup uploads / add-on installs

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://homeassistant;
    }
}

# --- eWeLink ---------------------------------------------------------------
server {
    listen 80; listen [::]:80;
    server_name ewelink.commander.one;
    access_log /var/log/nginx/ewelink.access.log;

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://ewelink;
    }
}

# --- Jellyfin --------------------------------------------------------------
# Clear Dashboard → Networking → Base URL, then restart Jellyfin.
server {
    listen 80; listen [::]:80;
    server_name jellyfin.commander.one;
    access_log /var/log/nginx/jellyfin.access.log;

    client_max_body_size 0;

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_set_header X-Forwarded-Protocol $scheme;
        proxy_pass http://jellyfin;
    }
}

