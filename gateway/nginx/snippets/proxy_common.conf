# Common reverse-proxy settings shared by every backend.
# Lives in /etc/nginx/snippets/ (NOT conf.d/) because conf.d/*.conf is
# auto-included at the http{} level and these directives belong in location{}.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket / SSE upgrade — needed by Home Assistant, Jellyfin, Sonarr,
# Radarr and Bazarr for live updates.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Don't buffer: keeps event streams and video seeking responsive.
proxy_buffering    off;
proxy_request_buffering off;
proxy_cache        off;

# Long-lived connections (websockets, Jellyfin transcodes).
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;
proxy_connect_timeout 30s;
